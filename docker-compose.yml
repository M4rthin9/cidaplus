# Production stack. SPEC.md §11.
#
#   docker compose --env-file /opt/cidaplus/.env up -d
#
# Never built on the box: `web` pulls an image built in CI (§2 — a production
# Next.js build alongside Postgres will OOM 6 GB). scripts/deploy.sh is the
# supported way to move between versions.

name: cidaplus

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Generated by scripts/cloudflare-ips.sh during provisioning. Caddy will
      # not start without it, which is deliberate: silently trusting nothing
      # would put Cloudflare's edge addresses in every access log.
      - ./caddy:/etc/caddy/snippets:ro
      # The Cloudflare Origin Certificate, installed once by hand (RUNBOOK).
      - ./certs:/certs:ro
      # Read-only: Caddy serves media but must never be able to write it.
      # Mounted at /srv/media, not /data/media as everywhere else: /data is
      # Caddy's own storage volume, and nesting the media volume inside it
      # makes the two mounts order-dependent for no benefit.
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    # Set WEB_IMAGE in the env file; deploy.sh rewrites it to roll forward or back.
    image: ${WEB_IMAGE:?WEB_IMAGE must be set — see scripts/deploy.sh}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cida:${POSTGRES_PASSWORD:?}@db:5432/cida
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_URL: ${AUTH_URL:?}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
      MEDIA_DIR: /data/media
      LINE_OA_URL: ${LINE_OA_URL:?}
      # Unset is the expected state — the contact form works without it (§9).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1024m
    healthcheck:
      # /api/health deliberately does not touch the database: this answers "is
      # the process serving", and a database outage should not restart the web
      # container in a loop on top of it.
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: cida
    # Tuned for a 1536m limit on a 6 GB box (§11). Passed as flags rather than a
    # mounted postgresql.conf so the numbers live next to the limit they assume.
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port. The database is reachable only on the compose network;
    # exposing 5432 on a box whose firewall allows Cloudflare ranges would be
    # the one hole that matters.
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cida -d cida"]
      interval: 10s
      timeout: 5s
      retries: 6

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_DIR: /backups
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      # Mounted so a restore runs from the container that already has psql and
      # the backups volume, rather than needing postgres tooling on the host.
      - ./scripts/restore.sh:/usr/local/bin/restore.sh:ro
      - backups:/backups
      # Read-only: the backup job copies media, it never modifies it.
      - media:/data/media:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    # Runs the nightly job at 03:15 Asia/Bangkok. The image has no cron daemon
    # worth configuring, so the loop is explicit and its schedule is readable.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache tzdata >/dev/null 2>&1 || true
        export TZ=Asia/Bangkok
        echo "[backup] scheduler started; nightly at 03:15 $$TZ"
        while true; do
          now=$$(date +%H%M)
          if [ "$$now" = "0315" ]; then
            sh /usr/local/bin/backup.sh || echo "[backup] run failed"
            sleep 3600
          fi
          sleep 30
        done

volumes:
  pgdata:
  media:
  backups:
  caddy_data:
  caddy_config:
  caddy_logs:
