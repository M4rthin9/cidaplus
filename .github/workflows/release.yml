# Build the production image and push it to GHCR. SPEC.md §2 and §11:
# "A production Next.js build alongside Postgres will OOM on that box — build
# images in CI and pull them." Nothing on the VPS ever runs `next build`.
#
# The Next build happens in the *job*, not in `docker build`: prerendering reads
# the catalog, so it needs a reachable database, and a service container is
# visible to the job but not to an isolated image build. The Dockerfile then
# packages the standalone output.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cida
          POSTGRES_PASSWORD: cida
          POSTGRES_DB: cida
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cida -d cida"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Phase 0: `next build` copies a .env from the working directory into
      # .next/standalone/.env and the standalone server loads it from there, so
      # a checkout carrying one would bake its secrets into the image.
      - name: Refuse to build with a .env present
        run: |
          if [ -f .env ]; then
            echo "::error::.env present in the checkout — it would be baked into the image"
            exit 1
          fi

      - name: Migrate
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://cida:cida@localhost:5432/cida

      # The build prerenders pages that read the catalog. Seeding keeps that
      # meaningful rather than merely non-crashing.
      - name: Seed
        run: pnpm db:seed
        env:
          DATABASE_URL: postgres://cida:cida@localhost:5432/cida

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://cida:cida@localhost:5432/cida
          AUTH_SECRET: build-only-secret-0123456789abcdef0123456789
          AUTH_URL: https://cidapt.com
          # Baked into the client bundle, so it must be the real origin even at
          # build time — a localhost value here ships localhost canonicals.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://cidapt.com' }}
          MEDIA_DIR: /data/media
          LINE_OA_URL: https://line.me/ti/p/%40355kxfoj

      - name: Assert the standalone output is complete
        run: |
          test -f .next/standalone/server.js || { echo "::error::no standalone server.js"; exit 1; }
          test -d .next/static || { echo "::error::no .next/static"; exit 1; }
          if [ -f .next/standalone/.env ]; then
            echo "::error::.next/standalone/.env exists — secrets would ship in the image"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha- tags are what deploy.sh pins to: a moving tag would make
          # "roll back to the previous image" meaningless.
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy command
        run: |
          echo "### Deploy this build" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ssh cidadeploy@cidapt.com" >> "$GITHUB_STEP_SUMMARY"
          echo "cd /opt/cidaplus && ./scripts/deploy.sh ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
