# Local development stack. SPEC.md §11.
#
#   docker compose -f docker-compose.dev.yml up
#
# is the only command needed for a working site at http://localhost:3000.
# Production compose (caddy, backup, memory limits) is phase 11.

name: cidaplus-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cida
      POSTGRES_PASSWORD: cida
      POSTGRES_DB: cida
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cida -d cida"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches contact-form mail locally so the SMTP path is exercisable while the
  # real provider is unchosen. UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: pnpm dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://cida:cida@db:5432/cida
      AUTH_SECRET: dev-only-secret-0123456789abcdef0123456789
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      MEDIA_DIR: /data/media
      LINE_OA_URL: https://line.me/ti/p/%40355kxfoj
      # SMTP stays unset by default: the contact form must work without it.
      # Point it at mailpit when testing that path.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  pgdata:
  node_modules:
  media:
